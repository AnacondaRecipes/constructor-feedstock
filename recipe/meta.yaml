{% set version = "3.17.0" %}

package:
  name: constructor
  version: {{ version }}

source:
  - url: https://github.com/conda/constructor/archive/{{ version }}.tar.gz
    sha256: 478ed6208231269cd9dfa0e7f6e01adf0bec1f83c463a86b62ed3a8781967da5
    patches:                        # [aarch64]
      - raspberry-pi-warning.patch  # [aarch64]

build:
  number: 0
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
    - NSIS_USING_LOG_BUILD=1   # [win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - constructor = constructor.main:main
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=70.1
    - setuptools-scm >=6.2
    - wheel
  run:
    - conda >=24.1
    - distro           # [linux]
    - python
    - ruamel.yaml >=0.11.14,<0.19
    - conda-standalone >=24.11.0
    - pillow >=3.1     # [win or osx]
    - nsis >=3.08      # [win]
    - jinja2
    - jsonschema >=4
    - briefcase >=0.4.3   # [win]
    - tomli-w >=1.2.0     # [win]
  run_constrained:     # [unix]
    - nsis >=3.08      # [unix]
    - conda-libmamba-solver !=24.11.0
    - pydantic >=2.11
test:
  source_files:
    - tests
    # No such file or directory: '../examples/miniforge/construct.yaml'
    - examples/miniforge
    # No such file or directory: '../examples/miniforge-mamba2/construct.yaml'
    - examples/miniforge-mamba2/
    # Include when running examples
    # - scripts
    # - examples
  requires:
    - pip
    - pytest
    - pytest-mock
    - pytest-split
    - conda-libmamba-solver
    - nsis =*=*log*  # [win]
    - pywin32        # [win]
  commands:
    - pip check
    - pytest -v tests -k "not examples"
    # Long running integration tests
    # - python scripts/run_examples.py  # [not win]
    - constructor --help
    - constructor -V
  imports:
    - constructor

about:
  home: https://docs.conda.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: create installer from conda packages
  description: |
    Constructor is a tool for constructing an installer for a collection of
    conda packages. It creates an Anaconda-like installer consisting of
    packages.
  doc_url: https://docs.conda.io/projects/conda
  dev_url: https://github.com/conda/constructor

extra:
  recipe-maintainers:
    - jakirkham
    - jschueller
    - mbargull
    - msarahan
    - jaimergp
    - marcoesters
